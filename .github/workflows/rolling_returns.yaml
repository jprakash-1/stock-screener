name: Sync to Hugging Face hub

on:
  push:
    branches: [master]

  # To run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://huggingface.co/spaces/Jprakash-1/rolling_returns
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git add rolling_returns/
          git status
          git commit --allow-empty -m "Update rolling returns."
          git push space main
